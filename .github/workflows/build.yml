name: Build ROM

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install dependencies
        # build-essential and git are already installed on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi libpng-dev

      - name: Build agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build the rotated ROM
        run: |
          make -j$(nproc)
          cp pokeemerald.gba emerald-180.gba
          sha1sum emerald-180.gba

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: emerald-180
          path: emerald-180.gba
          if-no-files-found: error
          retention-days: 30

      # Turning the rotation off must still give the original game, byte for byte
      - name: Check the original ROM still matches
        run: |
          sed -i 's|^#define ROTATE_OVERWORLD_180$|//#define ROTATE_OVERWORLD_180|' include/config.h
          grep -q '^//#define ROTATE_OVERWORLD_180$' include/config.h
          make -j$(nproc) compare
